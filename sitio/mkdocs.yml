site_name: Rukan
site_description: Modelos OpenSees y su narración en 3D — el repo de modelos de Rukan
site_url: https://fcocarrascob.github.io/rukan/
repo_url: https://github.com/fcocarrascob/rukan
repo_name: fcocarrascob/rukan
edit_uri: ""

docs_dir: docs
site_dir: _build

# Lo que empieza con `_` es maquinaria (generadores), no contenido.
exclude_docs: |
  _*

theme:
  name: material
  language: es
  custom_dir: overrides
  palette:
    scheme: default
    primary: black
    accent: deep orange
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - toc.integrate

plugins:
  - search:
      lang: es
  - macros:
      module_name: main

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - path: visor/rukan-visor.js
    type: module
  - visor/vendor/katex/katex.min.js
  - visor/vendor/katex/contrib/auto-render.min.js
  - js/katex.js

extra_css:
  - visor/vendor/katex/katex.min.css

nav:
  - Inicio: index.md
  - Series:
      - Qué es una serie: series/index.md
      - El galpón con puente grúa:
          - La serie: series/nch2369-galpon-grua/index.md
          - 00 · El modelo: series/nch2369-galpon-grua/00-el-modelo/index.md
          - 01 · El umbral de las 20 t: series/nch2369-galpon-grua/01-el-umbral-de-las-20-t/index.md
          - 02 · Nieve balanceada y desbalanceada: series/nch2369-galpon-grua/02-nieve-balanceada-y-desbalanceada/index.md
          - 03 · Cargas de puente grúa: series/nch2369-galpon-grua/03-cargas-de-grua/index.md
          - 04 · Espectro y R* por dirección: series/nch2369-galpon-grua/04-espectro-y-r-por-direccion/index.md
          - 05 · Masa sísmica y carga suspendida: series/nch2369-galpon-grua/05-masa-sismica-y-carga-suspendida/index.md
          - 06 · Combinaciones y derivas: series/nch2369-galpon-grua/06-combinaciones-y-derivas/index.md
          - 07 · El marco de momento a dos aguas: series/nch2369-galpon-grua/07-marco-de-momento-a-dos-aguas/index.md
          - 08 · La viga carrilera: series/nch2369-galpon-grua/08-viga-carrilera/index.md
          - 09 · La fatiga de la viga carrilera: series/nch2369-galpon-grua/09-fatiga-de-la-viga-carrilera/index.md
          - 10 · La columna escalonada: series/nch2369-galpon-grua/10-columna-escalonada-y-apoyo-de-la-carrilera/index.md
          - 11 · El arriostramiento de techo: series/nch2369-galpon-grua/11-arriostramiento-continuo-de-techo/index.md
          - 12 · Los dos vanos libres: series/nch2369-galpon-grua/12-los-dos-vanos-libres/index.md
  - Modelos:
      - El galpón con puente grúa: modelos/galpon-grua/index.md
      - La viga carrilera: modelos/carrilera/index.md
