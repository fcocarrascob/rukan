<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" role="img" aria-label="Detalle del apoyo visto a lo largo de la carrilera: los atiesadores de apoyo de 110 por 12 que llegan ajustados al ala inferior con destalonado de esquina de 25, el asiento sobre el fuste de grúa de 400 que transfiere por contacto sin soldar el ala inferior, el tirante empernado al ala superior que baja hasta el fuste con uso 0,57246 en categoría E contra el 0,87966 que tendría abajo, y las grapas del riel de 131,76 en pares opuestos a 750 mm" font-family="ui-monospace,'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11">
<title>Detalle del apoyo de la carrilera</title>
<rect width="840" height="540" fill="#fcfcfa"/>
<text x="24.0" y="30.0" fill="#2b2a26" text-anchor="start" font-size="11.5" font-weight="600">El tirante va arriba y el asiento transfiere por contacto: la misma categoría usa 0,57246 arriba y 0,87966 abajo</text>
<text x="24.0" y="48.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">detalle del apoyo sobre el fuste de grúa, visto a lo largo de la carrilera   ·   categoría de la Tabla A-3.1 en cada punto</text>
<rect x="290.0" y="342.2" width="120.0" height="92.0" fill="#d5d7da" stroke="#2b2a26" stroke-width="1.4"/>
<line x1="294.8" y1="342.2" x2="294.8" y2="434.2" stroke="#2b2a26" stroke-width="0.8"/>
<line x1="405.2" y1="342.2" x2="405.2" y2="434.2" stroke="#2b2a26" stroke-width="0.8"/>
<rect x="299.0" y="333.2" width="102.0" height="9.0" fill="#dcd8cc" stroke="#2b2a26" stroke-width="1.2"/>
<rect x="297.5" y="128.0" width="105.0" height="6.0" fill="#d5d7da" stroke="#2b2a26" stroke-width="1.1"/>
<rect x="348.8" y="134.0" width="2.4" height="195.0" fill="#d5d7da" stroke="#2b2a26" stroke-width="1.1"/>
<rect x="312.5" y="329.0" width="75.0" height="4.2" fill="#d5d7da" stroke="#2b2a26" stroke-width="1.1"/>
<polyline points="351.2,141.5 354.8,141.5 354.8,329.0 351.2,329.0 351.2,141.5" fill="#e6ece4" stroke="#4a6b46" stroke-width="1.2"/>
<polyline points="345.2,141.5 348.8,141.5 348.8,329.0 345.2,329.0 345.2,141.5" fill="#e6ece4" stroke="#4a6b46" stroke-width="1.2"/>
<line x1="354.8" y1="325.0" x2="480.5" y2="307.2" stroke="#4a6b46" stroke-width="0.9"/>
<text x="486.5" y="293.2" fill="#4a6b46" text-anchor="start" font-size="9.5" font-weight="normal">atiesador de apoyo 110.0×12.0</text>
<text x="486.5" y="307.2" fill="#4a6b46" text-anchor="start" font-size="9.5" font-weight="normal">ajustado al ala inferior, sin soldar</text>
<text x="486.5" y="321.2" fill="#4a6b46" text-anchor="start" font-size="9.5" font-weight="normal">destalonado 25.0 · cat. C</text>
<rect x="338.0" y="88.5" width="24.0" height="39.5" fill="#2f5d7c" stroke="#2f5d7c" stroke-width="0.9"/>
<rect x="363.6" y="119.0" width="13.0" height="9.0" fill="#cfd6da" stroke="#2f5d7c" stroke-width="0.9"/>
<rect x="323.4" y="119.0" width="13.0" height="9.0" fill="#cfd6da" stroke="#2f5d7c" stroke-width="0.9"/>
<text x="350.0" y="80.5" fill="#2f5d7c" text-anchor="middle" font-size="9.5" font-weight="normal">riel 131,76</text>
<line x1="331.4" y1="119.0" x2="277.5" y2="94.0" stroke="#c9c4b5" stroke-width="0.8"/>
<text x="271.5" y="84.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">grapas en pares opuestos</text>
<text x="271.5" y="98.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">a 750 mm, sin ganchos §5.15.3</text>
<rect x="402.5" y="128.0" width="12.0" height="214.2" fill="#eef0f1" stroke="#2f5d7c" stroke-width="1.2"/>
<circle cx="408.5" cy="173.1" r="2.4" fill="#2f5d7c"/>
<circle cx="408.5" cy="214.2" r="2.4" fill="#2f5d7c"/>
<text x="422.5" y="146.0" fill="#2f5d7c" text-anchor="start" font-size="9.5" font-weight="normal">tirante al ala superior</text>
<text x="422.5" y="160.0" fill="#2f5d7c" text-anchor="start" font-size="9.5" font-weight="600">cat. E: uso 0,57246</text>
<text x="422.5" y="174.0" fill="#a4442c" text-anchor="start" font-size="9.5" font-weight="600">el mismo abajo daría 0,87966</text>
<text x="422.5" y="188.0" fill="#8a8578" text-anchor="start" font-size="9" font-weight="normal">la razón es 1,53662</text>
<text x="422.5" y="202.0" fill="#8a8578" text-anchor="start" font-size="9" font-weight="normal">apernado, deslizamiento crítico §5.13</text>
<line x1="312.5" y1="333.2" x2="277.5" y2="355.2" stroke="#a4442c" stroke-width="0.9"/>
<text x="271.5" y="347.2" fill="#a4442c" text-anchor="end" font-size="9.5" font-weight="600">contacto, sin soldadura</text>
<text x="271.5" y="361.2" fill="#a4442c" text-anchor="end" font-size="9" font-weight="normal">§5.8.1 y §5.8.9</text>
<text x="350.0" y="395.2" fill="#2b2a26" text-anchor="middle" font-size="9.5" font-weight="normal">fuste de grúa 400</text>
<line x1="119.5" y1="128.0" x2="119.5" y2="333.2" stroke="#2b2a26" stroke-width="1"/>
<polygon points="119.5,128.0 122.3,135.2 116.7,135.2" fill="#2b2a26"/>
<polygon points="119.5,333.2 116.7,326.0 122.3,326.0" fill="#2b2a26"/>
<text x="111.5" y="233.6" fill="#2b2a26" text-anchor="end" font-size="10" font-weight="normal">684</text>
<text x="350.0" y="461.2" fill="#8a8578" text-anchor="middle" font-size="9.5" font-weight="normal">ala superior 350×20.0   ·   alma 8.0   ·   ala inferior 250×14.0</text>
<text x="24.0" y="492.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">el atiesador de apoyo hereda la categoría C del 09, y en el apoyo el momento es cero:</text>
<text x="24.0" y="508.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">lo que ve es la reacción entera, ciclo a ciclo, y no un rango de flexión</text>
</svg>
