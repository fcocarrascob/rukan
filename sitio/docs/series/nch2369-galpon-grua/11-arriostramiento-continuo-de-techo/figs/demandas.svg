<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Las cuatro demandas de fuerza sobre la diagonal del arriostramiento de techo, a la misma escala: 47,33782 kN del diafragma sismico, 161,02133 del arriostramiento del rafter en un punto, 2,51638 del fuste superior y 347,00299 de la acumulacion del Apendice 6, contra los 423,43911 kN de capacidad de la diagonal" font-family="ui-monospace,'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11">
<title>Las cuatro demandas sobre el mismo nudo</title>
<rect width="880" height="400" fill="#fcfcfa"/>
<text x="24.0" y="30.0" fill="#2b2a26" text-anchor="start" font-size="11.5" font-weight="600">Las cuatro demandas de fuerza del mismo nudo, y la que gobierna no es la sismica</text>
<text x="24.0" y="48.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">fuerza en la diagonal del vano extremo   ·   la de estabilidad del rafter acumulada es 7,33035 veces la del diafragma</text>
<text x="294.0" y="116.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">diafragma sismico longitudinal</text>
<text x="294.0" y="130.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">D1</text>
<rect x="306.0" y="104.0" width="44.7" height="18.0" fill="#2f5d7c" stroke="#2b2a26" stroke-width="0.9"/>
<text x="358.7" y="117.0" fill="#2f5d7c" text-anchor="start" font-size="10" font-weight="600">47,33782 kN</text>
<text x="294.0" y="170.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">arriostramiento del rafter, un punto</text>
<text x="294.0" y="184.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">D4</text>
<rect x="306.0" y="158.0" width="152.1" height="18.0" fill="#8a8578" stroke="#2b2a26" stroke-width="0.9"/>
<text x="466.1" y="171.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="600">161,02133 kN</text>
<text x="294.0" y="224.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">arriostramiento del fuste superior</text>
<text x="294.0" y="238.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">D5</text>
<rect x="306.0" y="212.0" width="2.4" height="18.0" fill="#4a6b46" stroke="#2b2a26" stroke-width="0.9"/>
<text x="316.4" y="225.0" fill="#4a6b46" text-anchor="start" font-size="10" font-weight="600">2,51638 kN</text>
<text x="294.0" y="278.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">acumulacion de Ap. 6.1, vano extremo</text>
<text x="294.0" y="292.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">D6</text>
<rect x="306.0" y="266.0" width="327.8" height="18.0" fill="#a4442c" stroke="#2b2a26" stroke-width="0.9"/>
<text x="625.8" y="279.0" fill="#fcfcfa" text-anchor="end" font-size="10" font-weight="600">347,00299 kN</text>
<line x1="306.0" y1="94.0" x2="306.0" y2="296.0" stroke="#c9c4b5" stroke-width="1"/>
<line x1="706.0" y1="94.0" x2="706.0" y2="296.0" stroke="#4a6b46" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="706.0" y="86.0" fill="#4a6b46" text-anchor="end" font-size="10" font-weight="600">φPn = 423,43911 kN</text>
<text x="24.0" y="336.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">la quinta demanda no es una fuerza sino una rigidez: el empuje de grua de 46,40000 kN se reparte entre los cinco marcos porque el diafragma</text>
<text x="24.0" y="354.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">es 27,81896 veces mas rigido, y el uso del limite de servicio de la grua queda en 0,05008</text>
<text x="24.0" y="378.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">el fuste superior pide 2,51638 kN sobre 3 815,76 mm de longitud no arriostrada, y la acumulacion por marco y agua vale 402,55333 kN</text>
</svg>
