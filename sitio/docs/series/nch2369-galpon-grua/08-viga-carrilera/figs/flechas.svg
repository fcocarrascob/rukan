<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Cuatro flechas de servicio de la viga carrilera contra sus limites en la misma escala de milimetros: la vertical de 8,26725 contra 12,50 y 7,50, la lateral de 14,64206 con la fuerza de CMAA y 13,62144 con la de AIST contra 18,75, y la suma de la deriva del marco con la flecha de la viga, 17,72361, contra el mismo 18,75 que ninguna clausula aplica a la suma" font-family="ui-monospace,'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11">
<title>La flecha que nadie mide</title>
<rect width="720" height="330" fill="#fcfcfa"/>
<text x="24.0" y="30.0" fill="#2b2a26" text-anchor="start" font-size="11.5" font-weight="600">La flecha que la cabeza del riel realmente ve no la mide ninguna cláusula</text>
<line x1="406.5" y1="58.0" x2="406.5" y2="250.0" stroke="#8a8578" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="400.5" y="52.0" fill="#8a8578" text-anchor="end" font-size="10" font-weight="normal">clase B · L/1000</text>
<text x="400.5" y="268.0" fill="#8a8578" text-anchor="end" font-size="10" font-weight="normal">7,50</text>
<line x1="501.5" y1="58.0" x2="501.5" y2="250.0" stroke="#4a6b46" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="507.5" y="52.0" fill="#4a6b46" text-anchor="start" font-size="10" font-weight="normal">clase C · L/600</text>
<text x="507.5" y="268.0" fill="#4a6b46" text-anchor="start" font-size="10" font-weight="normal">12,50</text>
<line x1="620.2" y1="58.0" x2="620.2" y2="250.0" stroke="#a4442c" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="626.2" y="52.0" fill="#a4442c" text-anchor="start" font-size="10" font-weight="normal">lateral · L/400</text>
<text x="626.2" y="268.0" fill="#a4442c" text-anchor="start" font-size="10" font-weight="normal">18,75</text>
<rect x="264.0" y="76" width="278.2" height="22" fill="#a4442c" opacity="0.85"/>
<text x="254.0" y="85.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">flecha lateral · CMAA 10 %</text>
<text x="254.0" y="98.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">uso 0,781 · gobierna</text>
<text x="634.2" y="91.0" fill="#a4442c" text-anchor="start" font-size="10.5" font-weight="normal">14,64206</text>
<rect x="264.0" y="120" width="258.8" height="22" fill="#8a8578" opacity="0.85"/>
<text x="254.0" y="129.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">flecha lateral · AIST 30 %</text>
<text x="254.0" y="142.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">uso 0,727</text>
<text x="634.2" y="135.0" fill="#8a8578" text-anchor="start" font-size="10.5" font-weight="normal">13,62144</text>
<rect x="264.0" y="164" width="336.7" height="22" fill="#2f5d7c" opacity="0.85"/>
<text x="254.0" y="173.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">marco + viga · en la cabeza</text>
<text x="254.0" y="186.0" fill="#8a8578" text-anchor="end" font-size="9.5" font-weight="normal">0,945 · nadie la mide</text>
<text x="634.2" y="179.0" fill="#2f5d7c" text-anchor="start" font-size="10.5" font-weight="normal">17,72361</text>
<rect x="264.0" y="164" width="58.5" height="22" fill="#2b2a26" opacity="0.55"/>
<text x="270.0" y="179.0" fill="#fcfcfa" text-anchor="start" font-size="9" font-weight="normal">marco</text>
<line x1="264.0" y1="58.0" x2="264.0" y2="256.0" stroke="#2b2a26" stroke-width="1"/>
<text x="254.0" y="268.0" fill="#8a8578" text-anchor="end" font-size="10" font-weight="normal">mm</text>
<text x="24.0" y="300.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">los dos 18,75 son el mismo número por dos caminos:</text>
<text x="24.0" y="314.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">h/400 al riel y L/400 sobre el vano — y sus demandas se suman</text>
</svg>
