<text x="24.0" y="462.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">Dentro de la rampa la ordenada no es monotona: cae de 0,42415 g en el origen a un minimo de 0,35404</text>
<text x="24.0" y="480.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">en 0,07649 s, sube a 0,36680 en 0,18600 y vuelve a caer a 0,34445 en la frontera.</text>
<text x="24.0" y="498.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">El periodo adoptado entrega 0,99872 de ese maximo local, asi que si maximiza la respuesta de su rama.</text>
