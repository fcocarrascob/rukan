<text x="24.0" y="660.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">El centro de rigidez cae en 15,00 m por simetria y no lo mueven los portones: lo que descentra la masa es donde se estaciona la grua,</text>
