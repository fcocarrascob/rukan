<text x="222.0" y="246.0" fill="#8a8578" text-anchor="end" font-size="10" font-weight="normal">mm en el alero</text>
<text x="242.0" y="272.0" fill="#8a8578" text-anchor="start" font-size="10" font-weight="normal">el sismo pasa §6.3 y triplica con holgura el límite de servicio de la grúa</text>
</svg>
