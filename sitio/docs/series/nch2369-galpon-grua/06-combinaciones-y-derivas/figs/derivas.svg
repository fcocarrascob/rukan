<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288" role="img" aria-label="Los tres desplazamientos contra los dos limites de deriva, el de la grua y el de la clausula 6.3, que estan en relacion seis a uno: el desplazamiento sismico de la direccion de marcos pasa el segundo y supera al primero" font-family="ui-monospace,'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11">
<title>Los dos límites de deriva, y el que manda</title>
<rect width="720" height="288" fill="#fcfcfa"/>
<text x="24.0" y="28.0" fill="#2b2a26" text-anchor="start" font-size="11.5" font-weight="600">El límite de la grúa es seis veces más estricto que el de §6.3</text>
<line x1="278.5" y1="54" x2="278.5" y2="228" stroke="#a4442c" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="284.5" y="48.0" fill="#a4442c" text-anchor="start" font-size="10" font-weight="normal">grúa · AIST §5.3</text>
<text x="284.5" y="246.0" fill="#a4442c" text-anchor="start" font-size="10" font-weight="normal">18,75</text>
<line x1="622.6" y1="54" x2="622.6" y2="228" stroke="#4a6b46" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="616.6" y="48.0" fill="#4a6b46" text-anchor="end" font-size="10" font-weight="normal">§6.3 · 0,015 h</text>
<text x="616.6" y="246.0" fill="#4a6b46" text-anchor="end" font-size="10" font-weight="normal">157,50</text>
<rect x="232" y="74" width="172.5" height="24" fill="#2f5d7c" opacity="0.85"/>
<text x="222.0" y="90.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">d con el espectro de referencia · Y</text>
<text x="412.5" y="90.0" fill="#2f5d7c" text-anchor="start" font-size="10.5" font-weight="normal">69,56272</text>
<rect x="232" y="126" width="36.1" height="24" fill="#2f5d7c" opacity="0.85"/>
<text x="222.0" y="142.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">d con el espectro de referencia · X</text>
<text x="292.5" y="142.0" fill="#2f5d7c" text-anchor="start" font-size="10.5" font-weight="normal">14,56458</text>
<rect x="232" y="178" width="28.8" height="24" fill="#8a8578" opacity="0.85"/>
<text x="222.0" y="194.0" fill="#2b2a26" text-anchor="end" font-size="10.5" font-weight="normal">d con el corte de diseño · el error</text>
<text x="292.5" y="194.0" fill="#8a8578" text-anchor="start" font-size="10.5" font-weight="normal">11,59379</text>
