# Publica `sitio/` en GitHub Pages en cada push a main.
#
# No instala Rukan ni OpenSees: los JSON de cada modelo (proyecto, resultados,
# escena) están versionados, y `sitio/main.py` solo los lee. Si un proyecto
# cambió sin recorrerse, `procedencia()` rompe el build y el despliegue no sale.
#
# Requiere, una sola vez, en Settings → Pages del repo: Source = «GitHub Actions».

name: sitio

on:
  push:
    branches: [main]
    paths: ["sitio/**", ".github/workflows/sitio.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.6" "mkdocs-macros-plugin>=1.3"
      - run: mkdocs build --strict -f sitio/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
